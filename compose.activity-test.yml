# Disposable Task 1 migration tests only. Never reads .env or starts the application stack.
services:
  pg:
    image: postgres:13
    environment:
      POSTGRES_USER: fixture_owner
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - target: 5432
        published: "0"
        host_ip: 127.0.0.1
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixture_owner -d postgres"]
      interval: 1s
      timeout: 2s
      retries: 30
